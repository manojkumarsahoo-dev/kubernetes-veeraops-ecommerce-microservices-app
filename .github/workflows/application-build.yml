name: CI/CD for app

on:
  workflow_dispatch:

  # push:
  #   branches:
  #     - main

env:
  AWS_REGION: us-east-1
  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"
  BACKEND_SERVICE: "backend"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Uncomment if re-enabling `on: push`:
    # if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          ref: main

      # -------------------------
      # AWS Credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # ECR Login
      # -------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Build & Push Images
      # -------------------------
      - name: Build and Push Docker Images
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA}"

          # -------- Frontend --------
          for service in $FRONTEND_SERVICES; do
            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
            MANIFEST="$FOLDER/deployment.yml"

            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "No Dockerfile in $FOLDER, skipping..."
              continue
            fi

            echo "Building $service"

            aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
              aws ecr create-repository \
                --repository-name "$REPO_NAME" \
                --image-scanning-configuration scanOnPush=true

            docker build -t "$IMAGE_URI" "$FOLDER"
            docker push "$IMAGE_URI"

            if [ -f "$MANIFEST" ]; then
              sed -i "s|image:.*|image: $IMAGE_URI|g" "$MANIFEST"
            else
              echo "Warning: $MANIFEST not found for $service"
            fi
          done

          # -------- Backend --------
          FOLDER="$BACKEND_SERVICE"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
          MANIFEST="$FOLDER/backend-deployment.yml"

          if [ -f "$FOLDER/Dockerfile" ]; then
            echo "Building $BACKEND_SERVICE"

            aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
              aws ecr create-repository \
                --repository-name "$REPO_NAME" \
                --image-scanning-configuration scanOnPush=true

            docker build -t "$IMAGE_URI" "$FOLDER"
            docker push "$IMAGE_URI"

            if [ -f "$MANIFEST" ]; then
              sed -i "s|image:.*|image: $IMAGE_URI|g" "$MANIFEST"
            else
              echo "Warning: $MANIFEST not found for $BACKEND_SERVICE"
            fi
          else
            echo "No Dockerfile in $FOLDER, skipping..."
          fi

      # -------------------------
      # Commit YAML changes
      # -------------------------
      - name: Commit updated YAML files
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add "frontend/*/deployment.yml" "backend/backend-deployment.yml"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "Update image tags after build [skip ci]"
          git push origin HEAD:main
